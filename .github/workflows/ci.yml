name: ci

on:
  pull_request:
  push:
    branches: [main]
    # Docs-only pushes don't rebuild images or cut a release; the weekly run
    # still picks up a new claude-code. Root *.md only: seed dirs are baked in.
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
  schedule:
    # 03:00 UTC Monday = Sunday evening in US time zones.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPO: ghcr.io/multigl/claude-container

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq rsync
      - name: pytest (gateway Okta helper)
        run: uv run pytest -q
      - name: Go (format, vet, test, cross-compile)
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o /dev/null ./cmd/claude-container
          done
      - name: bash suites
        run: tests/run.sh

  plan:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout here, so gh can't infer the repo from a git remote.
      GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha7: ${{ steps.resolve.outputs.sha7 }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve claude-code version and decide whether to build
        id: resolve
        run: |
          version="$(npm view @anthropic-ai/claude-code version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          build=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            # Skip only when every flavor already carries npm's latest AND that
            # published revision has its GitHub Release, so a publish that failed
            # partway (images or release) still gets retried. Missing or
            # unreadable image -> empty labels -> build.
            build=false
            for flavor in personal vertex gateway; do
              labels="$(docker buildx imagetools inspect "$IMAGE_REPO:$flavor-latest" --format '{{json .Image}}' 2>/dev/null \
                | jq -r '(if has("config") then . else .["linux/amd64"] end).config.Labels | [.["org.opencontainers.image.version"], .["org.opencontainers.image.revision"]] | map(. // "") | @tsv' 2>/dev/null || true)"
              published="$(cut -f1 <<<"$labels")"
              revision="$(cut -f2 <<<"$labels")"
              [[ "$published" == "$version" ]] || build=true
              if [[ -z "$revision" ]]; then
                build=true
              elif ! release_error="$(gh release view "v$version-${revision::7}" 2>&1)"; then
                # Only "not found" means build; any other gh failure must not
                # silently turn every weekly run into a rebuild.
                if [[ "$release_error" == *"release not found"* ]]; then
                  build=true
                else
                  echo "gh release view failed: $release_error" >> "$GITHUB_STEP_SUMMARY"
                  echo "gh release view failed: $release_error" >&2
                  exit 1
                fi
              fi
              echo "$flavor-latest claude-code: ${published:-<none>} revision: ${revision:-<none>}" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "npm latest: $version, build: $build" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    # -latest is what every install pulls, so only main may move it.
    if: needs.plan.outputs.build == 'true' && github.ref == 'refs/heads/main'
    # Each architecture builds on a native runner (no QEMU) and pushes untagged,
    # by digest; `merge` tags the pair as one multi-arch image.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push all flavors
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          CLAUDE_CODE_VERSION: ${{ needs.plan.outputs.version }}
          REVISION: ${{ github.sha }}
          CACHE_PREFIX: ${{ env.IMAGE_REPO }}:cache-${{ matrix.arch }}
        with:
          source: .
          files: docker-bake.hcl
          set: |
            *.platform=linux/${{ matrix.arch }}
            *.output=type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,name-canonical=true,push=true
      - name: Record digests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          mkdir digests
          for flavor in personal vertex gateway; do
            digest="$(jq -r --arg flavor "$flavor" '.[$flavor]["containerimage.digest"] // empty' <<<"$METADATA")"
            if [[ -z "$digest" ]]; then
              echo "no digest for $flavor in bake metadata" >&2
              exit 1
            fi
            echo "$digest" > "digests/$flavor"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [plan, publish]
    if: needs.plan.outputs.build == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA7: ${{ needs.plan.outputs.sha7 }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: digests
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag multi-arch images
        run: |
          for flavor in personal vertex gateway; do
            docker buildx imagetools create \
              -t "$IMAGE_REPO:$flavor-latest" \
              -t "$IMAGE_REPO:$flavor-$VERSION-$SHA7" \
              "$IMAGE_REPO@$(cat "digests/digests-amd64/$flavor")" \
              "$IMAGE_REPO@$(cat "digests/digests-arm64/$flavor")"
          done

  release:
    needs: [plan, merge]
    if: needs.plan.outputs.build == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA7: ${{ needs.plan.outputs.sha7 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binaries and create release
        run: |
          TAG="v${VERSION}-${SHA7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; skipping"
            exit 0
          fi
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath \
                -ldflags "-X github.com/multigl/claude-container/internal/buildinfo.Version=v${VERSION}-${SHA7} -X github.com/multigl/claude-container/internal/buildinfo.ImageSuffix=${VERSION}-${SHA7} -X github.com/multigl/claude-container/internal/buildinfo.ImageRepo=${IMAGE_REPO}" \
                -o "dist/claude-container_${target%/*}_${target#*/}" ./cmd/claude-container
          done
          (cd dist && sha256sum claude-container_* > SHA256SUMS)
          gh release create "$TAG" --latest --title "$TAG" \
            --notes "claude-code $VERSION, images $IMAGE_REPO:<flavor>-$VERSION-$SHA7" \
            dist/claude-container_* dist/SHA256SUMS
