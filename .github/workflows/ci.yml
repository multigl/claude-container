name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 03:00 UTC Monday = Sunday evening in US time zones.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPO: ghcr.io/multigl/claude-container

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq rsync
      - name: pytest (gateway Okta helper)
        run: uv run pytest -q
      - name: Go (format, vet, test, cross-compile)
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o /dev/null ./cmd/claude-container
          done
      - name: bash suites
        run: tests/run.sh

  plan:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout here, so gh can't infer the repo from a git remote.
      GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha7: ${{ steps.resolve.outputs.sha7 }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve claude-code version and decide whether to build
        id: resolve
        run: |
          version="$(npm view @anthropic-ai/claude-code version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          build=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            # Skip only when every flavor already carries npm's latest AND that
            # published revision has its GitHub Release, so a publish that failed
            # partway (images or release) still gets retried. Missing or
            # unreadable image -> empty labels -> build.
            build=false
            for flavor in personal vertex gateway; do
              labels="$(docker buildx imagetools inspect "$IMAGE_REPO:$flavor-latest" --format '{{json .Image}}' 2>/dev/null \
                | jq -r '(if has("config") then . else .["linux/amd64"] end).config.Labels | [.["org.opencontainers.image.version"], .["org.opencontainers.image.revision"]] | map(. // "") | @tsv' 2>/dev/null || true)"
              published="$(cut -f1 <<<"$labels")"
              revision="$(cut -f2 <<<"$labels")"
              [[ "$published" == "$version" ]] || build=true
              if [[ -z "$revision" ]]; then
                build=true
              elif ! release_error="$(gh release view "v$version-${revision::7}" 2>&1)"; then
                # Only "not found" means build; any other gh failure must not
                # silently turn every weekly run into a rebuild.
                if [[ "$release_error" == *"release not found"* ]]; then
                  build=true
                else
                  echo "gh release view failed: $release_error" >> "$GITHUB_STEP_SUMMARY"
                  echo "gh release view failed: $release_error" >&2
                  exit 1
                fi
              fi
              echo "$flavor-latest claude-code: ${published:-<none>} revision: ${revision:-<none>}" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "npm latest: $version, build: $build" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    # -latest is what every install pulls, so only main may move it.
    if: needs.plan.outputs.build == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA7: ${{ needs.plan.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Sequential flavors in one builder so the shared `base` stage builds once;
      # each flavor exports its own cache scope (an export covers only that build).
      - name: personal
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Containerfile
          target: personal
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CLAUDE_CODE_VERSION=${{ env.VERSION }}
          # Set here, not as a Containerfile ARG: a per-commit ARG would bust the
          # cache of every layer after it.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_REPO }}:personal-latest
            ${{ env.IMAGE_REPO }}:personal-${{ env.VERSION }}-${{ env.SHA7 }}
          cache-from: type=gha,scope=cc-personal
          cache-to: type=gha,scope=cc-personal,mode=max
      - name: vertex
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Containerfile
          target: vertex
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CLAUDE_CODE_VERSION=${{ env.VERSION }}
          # Set here, not as a Containerfile ARG: a per-commit ARG would bust the
          # cache of every layer after it.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_REPO }}:vertex-latest
            ${{ env.IMAGE_REPO }}:vertex-${{ env.VERSION }}-${{ env.SHA7 }}
          cache-from: |
            type=gha,scope=cc-vertex
            type=gha,scope=cc-personal
          cache-to: type=gha,scope=cc-vertex,mode=max
      - name: gateway
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Containerfile
          target: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CLAUDE_CODE_VERSION=${{ env.VERSION }}
          # Set here, not as a Containerfile ARG: a per-commit ARG would bust the
          # cache of every layer after it.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_REPO }}:gateway-latest
            ${{ env.IMAGE_REPO }}:gateway-${{ env.VERSION }}-${{ env.SHA7 }}
          cache-from: |
            type=gha,scope=cc-gateway
            type=gha,scope=cc-personal
          cache-to: type=gha,scope=cc-gateway,mode=max

  release:
    needs: [plan, publish]
    if: needs.plan.outputs.build == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA7: ${{ needs.plan.outputs.sha7 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binaries and create release
        run: |
          TAG="v${VERSION}-${SHA7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; skipping"
            exit 0
          fi
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath \
                -ldflags "-X github.com/multigl/claude-container/internal/buildinfo.Version=v${VERSION}-${SHA7} -X github.com/multigl/claude-container/internal/buildinfo.ImageSuffix=${VERSION}-${SHA7}" \
                -o "dist/claude-container_${target%/*}_${target#*/}" ./cmd/claude-container
          done
          (cd dist && sha256sum claude-container_* > SHA256SUMS)
          gh release create "$TAG" --latest --title "$TAG" \
            --notes "claude-code $VERSION, images $IMAGE_REPO:<flavor>-$VERSION-$SHA7" \
            dist/claude-container_* dist/SHA256SUMS
