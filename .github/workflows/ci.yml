name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 03:00 UTC Monday = Sunday evening in US time zones.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPO: ghcr.io/multigl/claude-container

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq rsync
      - name: pytest (gateway Okta helper)
        run: uv run pytest -q
      - name: bash suites
        run: tests/run.sh

  plan:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha7: ${{ steps.resolve.outputs.sha7 }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve claude-code version and decide whether to build
        id: resolve
        run: |
          version="$(npm view @anthropic-ai/claude-code version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          build=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            # Missing/unreadable published image -> empty -> build.
            published="$(docker buildx imagetools inspect "$IMAGE_REPO:personal-latest" --format '{{json .Image}}' 2>/dev/null \
              | jq -r '(if has("config") then . else .["linux/amd64"] end).config.Labels["org.opencontainers.image.version"] // empty' 2>/dev/null || true)"
            [[ -n "$published" && "$published" == "$version" ]] && build=false
            echo "published claude-code: ${published:-<none>}, npm latest: $version, build: $build" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA7: ${{ needs.plan.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Sequential flavors in one builder so the shared `base` stage builds once.
      - name: personal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: personal
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CLAUDE_CODE_VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_REPO }}:personal-latest
            ${{ env.IMAGE_REPO }}:personal-${{ env.VERSION }}-${{ env.SHA7 }}
          cache-from: type=gha,scope=claude-container
      - name: vertex
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: vertex
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CLAUDE_CODE_VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_REPO }}:vertex-latest
            ${{ env.IMAGE_REPO }}:vertex-${{ env.VERSION }}-${{ env.SHA7 }}
          cache-from: type=gha,scope=claude-container
      - name: gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CLAUDE_CODE_VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_REPO }}:gateway-latest
            ${{ env.IMAGE_REPO }}:gateway-${{ env.VERSION }}-${{ env.SHA7 }}
          cache-from: type=gha,scope=claude-container
          # Exported once, from the last flavor; the builder holds all three's layers.
          cache-to: type=gha,scope=claude-container,mode=max
